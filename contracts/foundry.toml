[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = ["forge-std/=lib/forge-std/src/"]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = false
show_metrics = true

[fmt]
line_length = 120
