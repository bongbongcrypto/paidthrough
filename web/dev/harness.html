<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light">
  <title>PaidThrough · dev harness</title>
  <!-- Dev only. Loads the real app.js with a mock wallet and an in-memory Arc (sim.js). Not linked from index.html. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="../styles.css">
  <style>
    .dev-panel {
      position: fixed; right: 12px; bottom: 12px; z-index: 50; width: 330px; max-height: 72vh; overflow: auto;
      padding: 10px 12px; background: #fff; border: 2px dashed #b42318; border-radius: 12px;
      font: 12px/1.45 ui-monospace, Consolas, monospace; letter-spacing: 0; color: #1e1e1e;
      box-shadow: 0 2px 10px rgba(0, 0, 0, .12);
    }
    .dev-panel--min > :not(.dev-top) { display: none; }
    .dev-panel p { margin: 4px 0; }
    .dev-panel .dev-h { font-weight: 700; margin: 0; }
    .dev-panel .dev-sub { color: #b42318; }
    .dev-panel .dev-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .dev-panel .dev-top { justify-content: space-between; }
    .dev-panel button { font: inherit; padding: 3px 8px; border: 1px solid #ccd1da; border-radius: 6px; background: #f7fafc; cursor: pointer; }
    .dev-panel fieldset { border: 1px solid #e4e8ee; border-radius: 6px; margin: 6px 0; padding: 4px 8px; }
    .dev-panel label { display: inline-block; margin-right: 8px; }
    .dev-panel .dev-links a { margin-right: 6px; }
    .dev-panel .dev-log { margin: 6px 0 0; padding-left: 18px; max-height: 160px; overflow: auto; }
    .dev-panel .dev-log .bad { color: #b42318; font-weight: 700; }
  </style>
  <script type="module" src="harness.js"></script>
</head>
<body>
  <div id="app" class="app"></div>
</body>
</html>
