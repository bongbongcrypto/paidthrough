name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  FOUNDRY_VERSION: v1.8.3
  FORGE_STD_TAG: v1.9.7

jobs:
  fmt:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: forge fmt
        working-directory: contracts
        run: forge fmt
      - name: Push formatted files
        run: |
          if git diff --quiet -- contracts; then
            echo "already formatted"
            exit 0
          fi
          git diff --stat -- contracts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/src contracts/test contracts/script
          git commit -m "style(contracts): forge fmt"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: Install forge-std (pinned)
        run: forge install "foundry-rs/forge-std@${FORGE_STD_TAG}" --no-git
      - name: Versions
        run: forge --version
      - name: Build (with sizes)
        run: forge build --sizes
      - name: Test
        run: forge test -vvv
      - name: Gas report
        run: |
          forge test --gas-report --no-match-contract "Invariant|ArcFork" | tee gas-report.txt
          {
            echo "## Gas report (unit, auth, blocklist, fuzz suites)"
            echo '```'
            cat gas-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  arc-fork:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      ARC_RPC_URL: https://rpc.mainnet.arc.io
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: Install forge-std (pinned)
        run: forge install "foundry-rs/forge-std@${FORGE_STD_TAG}" --no-git
      - name: Arc mainnet fork test
        run: forge test --match-contract ArcFork -vvv

  arc-rehearsal:
    # Read-only rehearsal on the real Arc mainnet node: eth_call / eth_estimateGas with state overrides.
    needs: test
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      ARC_RPC_URL: https://rpc.mainnet.arc.io
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: Install forge-std (pinned)
        working-directory: contracts
        run: forge install "foundry-rs/forge-std@${FORGE_STD_TAG}" --no-git
      - name: Build
        working-directory: contracts
        run: forge build
      - uses: actions/upload-artifact@v4
        with:
          name: contracts-out
          path: |
            contracts/out/PaidThrough.sol/PaidThrough.json
            contracts/out/RehearsalProbe.sol/RehearsalProbe.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install rehearsal deps
        run: pip install eth-account==0.13.7 eth-abi pycryptodome
      - name: Rehearse every path on Arc mainnet (read-only)
        run: python scripts/rehearse_mainnet.py --out contracts/out --markdown rehearsal.md --json rehearsal.json
      - name: Deploy dry run against the real node (read-only, random sender, no key)
        run: python scripts/deploy_mainnet.py --network mainnet --out contracts/out | tee deploy-dry-run.txt
      - name: Verification inputs (the commands verify.yml uses, with a placeholder address)
        working-directory: contracts
        run: |
          ARGS=$(cast abi-encode 'constructor(address,uint96)' 0x3600000000000000000000000000000000000000 10000000000)
          echo "constructor args: $ARGS"
          forge verify-contract 0x0000000000000000000000000000000000000001 src/PaidThrough.sol:PaidThrough             --constructor-args "$ARGS" --show-standard-json-input > ../standard-json-input.json
          python3 -c "import json; d=json.load(open('../standard-json-input.json')); print(d['language'], d['settings']['optimizer'], d['settings'].get('evmVersion'), len(d['sources']), 'sources')"
      - name: Job summary
        if: always()
        run: |
          if [ -f rehearsal.md ]; then cat rehearsal.md >> "$GITHUB_STEP_SUMMARY"; else echo "rehearsal produced no table" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arc-rehearsal
          path: |
            rehearsal.md
            rehearsal.json
            deploy-dry-run.txt
            standard-json-input.json
          if-no-files-found: warn

  keeper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect keeper tests
        id: detect
        run: |
          if [ -d keeper/tests ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "keeper/tests not present; nothing to run"
          fi
      - uses: actions/setup-python@v5
        if: steps.detect.outputs.present == 'true'
        with:
          python-version: "3.11"
      - name: Install keeper test deps
        if: steps.detect.outputs.present == 'true'
        run: pip install eth-account==0.13.7 eth-abi pycryptodome
      - name: Keeper unit tests
        if: steps.detect.outputs.present == 'true'
        run: python -m unittest discover -s keeper/tests -v

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: pip install eth-account==0.13.7 eth-abi pycryptodome
      - name: Deploy script unit tests (fake RPC, no network)
        run: python -m unittest discover -s scripts/tests -v
